<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Visit Status Tracker</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 30px; 
            background-color: #f4f6f9; 
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1); 
            max-width: 1250px; 
            margin: auto; 
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .btn-home {
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-home:hover {
            background-color: #5a6268;
        }
        h2 { 
            color: #1e3d59; 
            margin: 0;
        }
        .form-group { 
            margin-bottom: 20px; 
            margin-top: 20px;
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 8px; 
            color: #333;
        }
        input[type="file"] { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            background-color: #fff;
        }
        button { 
            background-color: #1e3d59; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        button:hover { 
            background-color: #2ECC71; 
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
        }
        th, td { 
            border: 1px solid #aaaaaa; 
            text-align: left; 
            padding: 10px; 
            font-size: 13px; 
        }
        th { 
            background-color: #1e3d59; 
            color: white; 
            font-weight: bold;
        }
        
        /* High-contrast solid bright color rows */
        .row-delay { 
            background-color: #FFA500 !important; 
            color: black !important; 
            font-weight: bold; 
        }
        .row-ontime { 
            background-color: #2ECC71 !important; 
            color: black !important; 
            font-weight: bold; 
        }
        .row-yet { 
            background-color: #FFFF00 !important; 
            color: black !important; 
            font-weight: bold; 
        }
        
        .btn-download { 
            background-color: #2ECC71; 
            text-decoration: none; 
            color: white; 
            padding: 12px 20px; 
            display: inline-block; 
            border-radius: 4px; 
            margin-bottom: 15px; 
            font-weight: bold; 
            text-align: center;
            transition: background-color 0.2s ease;
        }
        .btn-download:hover {
            background-color: #27ae60;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>🚚 First Visit Status Tracker Dashboard</h2>
        <a href="/" class="btn-home">🏠 Back to Home</a>
    </div>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Select Logistics Data Dump Excel File (.xlsx):</label>
            <input type="file" name="master_file" accept=".xlsx" required>
        </div>
        <button type="submit">🚀 Get Report</button>
    </form>

    {% if show_table %}
    <hr>
    <h3>📊 Extracted First Visit Live Preview</h3>
    <a href="/download/firstvisit" class="btn-download">📥 Download Colored Excel Report</a>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    {% for col in columns %}
                    <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr class="{% if row['Status'] == 'Delay' %}row-delay{% elif row['Status'] == 'Yet to done' %}row-yet{% else %}row-ontime{% endif %}">
                    {% for col in columns %}
                    <td>{{ row[col] }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endif %}
</div>

</body>
</html>
