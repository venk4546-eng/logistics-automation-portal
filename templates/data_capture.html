<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Capture Module</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-home { background-color: #6c757d; color: white; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        h2 { color: #1e3d59; margin: 0; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #333; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: #fff; }
        button { background-color: #8e44ad; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #732d91; }
        .btn-download { background-color: #27ae60; text-decoration: none; color: white; padding: 12px 20px; display: inline-block; border-radius: 4px; margin-top: 15px; font-weight: bold; }
        .btn-download:hover { background-color: #219150; }
        .success-box { background: #e8f8f5; border: 1px solid #2ecc71; padding: 20px; border-radius: 5px; text-align: center; margin-top: 25px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>📷 Data Capture Processing</h2>
        <a href="/" class="btn-home">🏠 Back to Home</a>
    </div>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>1. Select Data Capture File (.xls / .xlsx):</label>
            <input type="file" name="data_file" accept=".xlsx,.xls" required>
        </div>
        <div class="form-group">
            <label>2. Select Cluster Master File (.xls / .xlsx):</label>
            <input type="file" name="cluster_file" accept=".xlsx,.xls" required>
        </div>
        <button type="submit">🚀 Process TAT & Map Cluster</button>
    </form>

    {% if show_result %}
    <div class="success-box">
        <h3 style="color: #27ae60; margin-top:0;">🎉 File Processed Successfully!</h3>
        <p><b>TAT</b> and <b>Cluster</b> columns have been added to your file.</p>
        <a href="/download/data_capture" class="btn-download">📥 Download Processed Data Capture File (.xlsx)</a>
    </div>
    {% endif %}
</div>

</body>
</html>
